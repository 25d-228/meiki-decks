name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused tests
        run: python -m unittest discover -s tests -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q meiki_decks.py tests
      - name: Check Python formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          for python_file in (Path("meiki_decks.py"), Path("tests/test_meiki_decks.py")):
              lines = python_file.read_text(encoding="utf-8").splitlines()
              if any(line.endswith((" ", "\t")) for line in lines):
                  raise SystemExit(f"trailing whitespace in {python_file}")
              if any(len(line) > 100 for line in lines):
                  raise SystemExit(f"line longer than 100 characters in {python_file}")
          PY

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tracked tree
        run: |
          python - <<'PY'
          import subprocess

          expected_files = {
              ".github/workflows/ci.yml",
              ".gitignore",
              "LICENSE",
              "README.md",
              "cards/ja-JP/00.json",
              "cards/ja-JP/01.json",
              "cards/ja-JP/02.json",
              "cards/ja-JP/03.json",
              "cards/ja-JP/04.json",
              "cards/ja-JP/05.json",
              "cards/ko-KR/00.json",
              "cards/ko-KR/01.json",
              "coverage/ja-JP/00.md",
              "coverage/ja-JP/01.md",
              "coverage/ja-JP/02.md",
              "coverage/ja-JP/03.md",
              "coverage/ja-JP/04.md",
              "coverage/ja-JP/05.md",
              "coverage/ko-KR/00.md",
              "coverage/ko-KR/01.md",
              "meiki_decks.py",
              "pyproject.toml",
              "release-notes/ja-JP-v0.1.0.md",
              "tests/test_meiki_decks.py",
          }
          tracked_files = set(
              subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          )
          if tracked_files != expected_files:
              raise SystemExit(f"tracked tree is incorrect: {sorted(tracked_files)}")
          PY
      - name: Validate Japanese source
        run: |
          python meiki_decks.py check --language ja-JP --stage 00
          python meiki_decks.py check --language ja-JP --stage 01
          python meiki_decks.py check --language ja-JP --stage 02
          python meiki_decks.py check --language ja-JP --stage 03
          python meiki_decks.py check --language ja-JP --stage 04
          python meiki_decks.py check --language ja-JP --stage 05
      - name: Validate Korean source
        run: |
          python meiki_decks.py check --language ko-KR --stage 00
          python meiki_decks.py check --language ko-KR --stage 01
      - name: Build and verify tiny archive
        run: >-
          python -m unittest -v
          tests.test_meiki_decks.MeikiDecksTests.test_build_creates_verified_version_four_archive_with_deduplicated_media
