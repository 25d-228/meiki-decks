name: Source text

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /tmp/meiki-decks-zh-06
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Prepare local temporary directory
        run: mkdir -p /tmp/meiki-decks-zh-06
      - name: Focused source fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Spanish 01 text and coverage
        run: python3 -B scripts/check_source.py --locale es-MX --stage 01 --expected-count 600
      - name: Validate Spanish 02 text, coverage and cross-stage duplicates
        run: python3 -B scripts/check_source.py --locale es-MX --stage 02 --expected-count 800
      - name: Validate Spanish 03 text, coverage and both prior stages
        run: python3 -B scripts/check_source.py --locale es-MX --stage 03 --expected-count 1000
      - name: Validate Spanish 04 text, coverage and all three prior stages
        run: python3 -B scripts/check_source.py --locale es-MX --stage 04 --expected-count 1200
      - name: Validate Spanish 05 text, coverage and all four prior stages
        run: python3 -B scripts/check_source.py --locale es-MX --stage 05 --expected-count 1400
      - name: Validate Spanish 06 text, coverage and all five prior stages
        run: python3 -B scripts/check_source.py --locale es-MX --stage 06 --expected-count 1600
      - name: Validate Spanish 07 text, coverage and all six prior stages
        run: python3 -B scripts/check_source.py --locale es-MX --stage 07 --expected-count 1000
      - name: Validate Chinese 00 text and coverage
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 00 --expected-count 200
      - name: Validate Chinese 01 text, coverage and accepted Chinese 00 duplicates
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 01 --expected-count 400
      - name: Validate Chinese 02 text, coverage and both accepted Chinese predecessors
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 02 --expected-count 600
      - name: Validate Chinese 03 text, coverage and all three accepted Chinese predecessors
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 03 --expected-count 800
      - name: Validate Chinese 04 text, coverage and all four accepted Chinese predecessors
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 04 --expected-count 1000
      - name: Validate Chinese 05 text, coverage and all five accepted Chinese predecessors
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 05 --expected-count 1000
      - name: Validate Chinese 06 text, coverage and all six accepted Chinese predecessors
        run: python3 -B scripts/check_source.py --locale zh-Hans-CN --stage 06 --expected-count 1200
      - name: Whitespace
        run: git diff --check HEAD^ HEAD
